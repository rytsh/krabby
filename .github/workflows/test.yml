on: [push, pull_request]

name: Test

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # -race is the point of running the suite in CI rather than just locally:
      # this codebase coordinates queue dispatch, sync workers and index
      # rebuilds across goroutines, and those are exactly the bugs a plain
      # `go test` cannot see.
      - name: Test backend
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Blocking, unlike the report-only run in the sonarcloud job below: that
      # one exists to feed Sonar a full checkstyle report and must not fail the
      # build, which meant nothing enforced the linters on a pull request.
      - name: Lint backend
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 10m

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: _ui/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: _ui
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: _ui
        run: pnpm test
      - name: Check frontend
        working-directory: _ui
        run: pnpm check
      - name: Lint frontend
        working-directory: _ui
        run: pnpm lint
      - name: Build frontend
        working-directory: _ui
        run: pnpm build

  sonarcloud:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Get repository name
        run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tested Graphify
        run: python -m pip install graphifyy==0.9.26
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 10m --new-from-rev=HEAD~1 --issues-exit-code=0
      - name: Run tests
        env:
          KRABBY_GRAPHIFY_INTEGRATION: "1"
        run: |
          golangci-lint run --issues-exit-code=0 --output.checkstyle.path=golangci-lint-report.out ./...
          go test -coverprofile=coverage.out -json ./... > test-report.out
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ env.REPOSITORY_NAME }}
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.go.tests.reportPaths=test-report.out
            -Dsonar.go.golangci-lint.reportPaths=golangci-lint-report.out
            -Dsonar.sources=.
            -Dsonar.exclusions=**/vendor/**,**/*_test.go,_ui/**,internal/server/dist/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
