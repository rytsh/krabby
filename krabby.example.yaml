# krabby example configuration.
# Copy to krabby.yaml (auto-discovered in cwd) or point CONFIG_FILE at it.
# Every field can also be set via env with the KRABBY_ prefix,
# e.g. KRABBY_SERVER_PORT=9090, KRABBY_MCP_API_KEY=....

log_level: info

# Clones, graphs and state live here.
data_dir: ~/.krabby

server:
  host: ""
  port: "8080"
  # base_path: /krabby   # serve the whole app (UI, REST API, MCP, webhook)
                         # under a URL prefix, e.g. behind a reverse proxy on a
                         # subpath. Empty (default) serves everything at root.
                         # The UI uses a hash router + relative assets, so it is
                         # base-path agnostic and needs no rebuild.

mcp:
  path: /mcp
  # api_key: change-me            # require X-Api-Key / Bearer on /mcp

graphify:
  bin: graphify              # graphify CLI (uv tool install graphifyy==0.9.26)
  # python: /path/to/python  # interpreter that can `import graphify` (auto-detected)
  build_timeout: 30m         # graph queries are answered in-process (no serve subprocess)
  # exclude:                 # extra gitignore-style patterns kept out of the graph
  #   - "testdata/"          # (defaults already skip testdata/, fixtures/, *.min.js, …)
  #   - "examples/"
  # merge: false             # build a cross-repo merged graph (queried when a graph
                             # tool is called with no repo id). Off by default:
                             # independent repos share no symbols, so the merge is
                             # just a costly disjoint union. Enable only for split
                             # monorepos / interdependent modules.
  # cache_max_bytes: 536870912  # cap (bytes) on parsed graphs kept in memory by the
                             # query engine. Each tracked repo's graph is parsed once
                             # and cached; past this budget the least-recently-used
                             # graphs are evicted (reloaded on next query). Unset (0)
                             # derives the cap from the memory budget below (1/16 of
                             # it, between 64 MiB and 512 MiB). A negative value
                             # disables eviction entirely (unbounded).

memory:
  # krabby holds three embedded databases, a parsed-graph cache and transient
  # indexing buffers, and runs the graphify CLI inside the same container. Left
  # untuned those add up to more than a small container limit, so every cache is
  # derived from one number.
  #
  # limit_bytes: 0     # total budget. 0 (default) auto-detects the cgroup limit,
                       # falling back to total system memory — correct in almost
                       # every deployment. Set it only when krabby shares its
                       # cgroup with another workload.
  ratio: 0.75          # fraction of the limit handed to Go as GOMEMLIMIT. The
                       # rest covers the graphify subprocess, git, mmap'd database
                       # tables and runtime overhead outside the heap. An explicit
                       # GOMEMLIMIT environment variable overrides this.

# Docs, LLM/embedder, RAG/code-RAG, repository polling, git credentials and
# webhook security are persisted runtime settings. Configure them from the UI
# or REST API; changes apply without restarting krabby.
#
# Repositories are added at runtime via the add_repo MCP tool, the UI, or
# POST /api/v1/repos (with an optional "namespace"); additions are persisted.

telemetry: {}
