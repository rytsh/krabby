version: 2

project_name: krabby

# The web UI is embedded from internal/server/dist, which is generated rather
# than committed (see .gitignore). Without this hook a release embeds whatever
# happens to be in that directory on the build machine — a stale UI from an
# older checkout, or the empty placeholder — and ships a binary whose frontend
# silently does not match its backend.
before:
  hooks:
    - make build-ui

builds:
  - main: ./cmd/krabby
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    flags:
      - -trimpath

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - krabby.example.yaml

# dockers_v2 builds a single multi-arch manifest with `docker buildx build`,
# reusing the linux binaries produced above. It needs a buildx builder that can
# target linux/amd64 and linux/arm64 (see `make build-container` for a local
# single-arch smoke test):
#   docker buildx create --name=goreleaser --use
#   docker run --privileged --rm tonistiigi/binfmt --install all
dockers_v2:
  - images:
      - "ghcr.io/rytsh/krabby"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile
    labels: &image_metadata
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
    # Labels live on each per-platform image config; registries read the
    # equivalent annotations off the manifest index, so set both.
    annotations: *image_metadata
    # Parity with the old --pull build flag: always re-resolve the base image so
    # a release never bakes in a stale locally-cached python:3.12-slim.
    flags:
      - "--pull"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
