<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Krabby Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icons/icon32.png" width="24" height="24" alt="" />
        <strong>Krabby Browser Importer</strong>
      </div>
      <p id="origin">Open your Krabby UI to connect it.</p>
      <button id="toggle" disabled>Connect this origin</button>
      <p class="hint">Only connected origins can ask the extension to render pages.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
